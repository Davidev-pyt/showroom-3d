<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
      <script src="tailwind.js"></script>
    <title>showroom-3d</title>
</head>
<body class="bg-zinc-950 text-white">

    <nav class="w-full py-6 px-8 flex justify-between items-center border-b border-zinc-900">
        <span class="text-xl font-black tracking-tighter uppercase">BMW M</span>
        <div class="flex gap-6">
            <a class="flex text-sm font-medium text-zinc-400 hover:text-white transition-colors">Modelos</a>
            <a class="flex text-sm font-medium text-zinc-400 hover:text-white transition-colors">Showroom 3D</a>
            <a class="flex text-sm font-medium text-zinc-400 hover:text-white transition-colors">Configurador</a>
        </div>

    </nav>
    <!--GRANDE CAIXA PRINCIPAL DO SHOWROOM (Grid Pai) -->
    <div class="max-w-7xl mx-auto px-8 py-12 grid grid-cols-1 md:grid-cols-2 gap-8 items-center min-h-[70vh]">
        
        <!--O Slogan com Degradê Metálico -->
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-zinc-500 uppercase">
            O PURO PRAZER DE DIRIGIR.
        </h1>
               <!-- O Palco do Carro 3D Corrigido -->
        <div id="canvas-3d" class="w-full h-[50vh] md:h-[60vh] bg-zinc-900/10 rounded-3xl border border-zinc-900 overflow-hidden relative shadow-2xl shadow-emerald-500/5">
            <!-- Usando o componente oficial do Spline Viewer -->
            <spline-viewer url="https://spline.design"></spline-viewer>
        </div>

    </div> <!-- Fechamento da Grid Pai -->

        <script type="module" src="https://unpkg.com"></script
</html>


    <!--Importação Oficial do Spline via jsDelivr -->
    <script type="module" src="https://jsdelivr.net"></script>

    <!-- Conecta o arquivo de lógica -->
    <script src="script.js"></script>
</body>
</html>
